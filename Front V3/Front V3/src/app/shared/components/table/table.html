<table>
  <thead>
    <tr>
      @for (col of columns; track $index) {
        <th>{{ col.label }}</th>
      }
      <th>Acciones</th>
    </tr>
  </thead>

  <tbody>
    @for (item of data; track $index) {
    <tr>
      @for (col of columns; track $index) {
        <td>{{ item[col.field] }}</td>
      }

      <td>
        <button (click)="view.emit(item)">Ver</button>
        <button (click)="edit.emit(item)">Editar</button>
        <button (click)="delete.emit(item)">Eliminar</button>
      </td>
    </tr>
    }
  </tbody>
</table>
