<h2>Empleados</h2>

<div class="filters">
  <input placeholder="Buscar por nombre" #searchInput (input)="onSearchChange(searchInput.value)" />
  <button routerLink="new">Nuevo</button>
  <button class="btn-export btn-pdf"   (click)="exportPdf()"   title="Exportar a PDF">📄 PDF</button>
  <button class="btn-export btn-excel" (click)="exportExcel()" title="Exportar a Excel">📊 Excel</button>
</div>

@if (loading) {
  <div class="loading-state">
    <span class="spinner"></span>
    <p>Cargando empleados...</p>
  </div>
} @else {
  <app-table
    [data]="filtered"
    [columns]="columns"
    (view)="onView($event)"
    (edit)="onEdit($event)"
    (delete)="onDelete($event)"
    (qr)="onQr($event)"
    [currentPage]="currentPage"
    [totalPages]="totalPages"
    (pageChange)="changePage($event)">
  </app-table>
}

@if (showQrModal && selectedEmployee) {
  <app-qr-modal
    [entityType]="'employee'"
    [entityId]="selectedEmployee.id_employee"
    [label]="'Empleado: ' + selectedEmployee.name"
    (close)="onQrClose()">
  </app-qr-modal>
}
