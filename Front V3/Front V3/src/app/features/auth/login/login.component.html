<div class="login-container">
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <h2>SGT - Inicio de Sesión</h2>
    
    <div class="field">
      <label>Usuario</label>
      <input type="text" formControlName="username" placeholder="Tu usuario de administrador">
    </div>

    <div class="field">
      <label>Contraseña</label>
      <input type="password" formControlName="password" placeholder="••••••••">
    </div>

    <button type="submit" [disabled]="loginForm.invalid">
      Entrar al Sistema
    </button>
  </form>
</div>
