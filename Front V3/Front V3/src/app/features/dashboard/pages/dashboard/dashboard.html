<h1>Principal</h1>

@if (loading) {
  <div class="loading-state">
    <span class="spinner"></span>
    <p>Cargando estadísticas...</p>
  </div>
} @else {
  <div class="cards">
    @for (stat of stats; track $index) {
      <div class="card">
        <h3>{{ stat.title }}</h3>
        <p>{{ stat.value }}</p>
      </div>
    }
  </div>
}
