<div class="login-container">

  <div class="card">

    <h1>Iniciar Sesión</h1>

    <form (ngSubmit)="login()">

      <input
        type="text"
        [(ngModel)]="username"
        name="username"
        placeholder="Usuario"
      />

      <input
        type="password"
        [(ngModel)]="password"
        name="password"
        placeholder="Contraseña"
      />

      <button type="submit">
        Entrar
      </button>

    </form>

  </div>

</div>
