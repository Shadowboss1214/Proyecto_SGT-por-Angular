<h2>Transportes</h2>

<div class="filters">
    <input placeholder="Buscar por nombre o placa" #searchInput
        (input)="onSearchChange(searchInput.value)" />

    <select #statusSelect (change)="onStatusChange(statusSelect.value)">
        <option value="">Todos</option>
        <option value="Activo">Activo</option>
        <option value="Inactivo">Inactivo</option>
        <option value="Mantenimiento">En Mantenimiento</option>
    </select>

    <button routerLink="new">Nuevo</button>

    <button class="btn-export btn-pdf" (click)="exportPdf()" title="Exportar a PDF">
        📄 PDF
    </button>

    <button class="btn-export btn-excel" (click)="exportExcel()" title="Exportar a Excel">
        📊 Excel
    </button>
</div>

<app-table 
  [columns]="columns" 
  [data]="filtered"
  (view)="onView($event)"
  (edit)="onEdit($event)"
  (delete)="onDelete($event)">
</app-table>
