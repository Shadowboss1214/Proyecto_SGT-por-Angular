<h2>Viajes</h2>

<div class="filters">
    <input placeholder="Buscar por transporte o empleado" #searchInput
        (input)="onSearchChange(searchInput.value)" />

    <button routerLink="new">Nuevo</button>

    <button class="btn-export btn-pdf" (click)="exportPdf()" title="Exportar a PDF">
        📄 PDF
    </button>

    <button class="btn-export btn-excel" (click)="exportExcel()" title="Exportar a Excel">
        📊 Excel
    </button>
</div>

<app-table
  [data]="filtered"
  [columns]="columns"
  (view)="onView($event)"
  (edit)="onEdit($event)"
  (delete)="onDelete($event)"
  (qr)="onQr($event)">
</app-table>

@if (showQrModal && selectedTrip) {
  <app-qr-modal [trip]="selectedTrip" (close)="onQrClose()"></app-qr-modal>
}
