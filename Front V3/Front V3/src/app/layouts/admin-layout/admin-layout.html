<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <p class="brand-name">Bus.inc</p>
      <p class="brand-sub">Panel de Administración</p>
    </div>
    <nav>
      <button [class.active]="isActive('dashboard')" (click)="goToDashboard()">Principal</button>
      <button [class.active]="isActive('employee')"  (click)="goToEmployees()">Empleados</button>
      <button [class.active]="isActive('transport')" (click)="goToTransport()">Transportes</button>
      <button [class.active]="isActive('trips')"     (click)="goToTrips()">Viajes</button>
      <button [class.active]="isActive('logistics')" (click)="goToLogistic()">Logística</button>
    </nav>
  </aside>

  <div class="content">
    <app-top-menu></app-top-menu>
    <div class="page-body">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
